name: Publish development formula

on:
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed

permissions: {}

concurrency:
  group: publish-development-formula
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        startsWith(github.event.workflow_run.head_branch, 'automation/binjad-dev-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head_branch: ${{ steps.validation.outputs.head_branch }}
      head_sha: ${{ steps.validation.outputs.head_sha }}
      pull_request: ${{ steps.validation.outputs.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check out the tested tap head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate the development formula and bottle artifacts
        id: validation
        run: |
          test "$RUN_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_HEAD_BRANCH" =~ ^automation/binjad-dev-([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          binary_ninja_version="${BASH_REMATCH[1]}"

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$RUN_HEAD_SHA"
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.conclusion' <<<"$run")" = success

          pull_numbers="$(jq -r '.pull_requests[].number' <<<"$run")"
          test "$(wc -w <<<"$pull_numbers" | tr -d ' ')" = 1
          pull_request="$pull_numbers"
          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request")"
          test "$(jq -r '.state' <<<"$pull")" = open
          test "$(jq -r '.base.ref' <<<"$pull")" = main
          test "$(jq -r '.head.ref' <<<"$pull")" = "$RUN_HEAD_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pull")" = "$RUN_HEAD_SHA"
          test "$(jq -r '.head.repo.full_name' <<<"$pull")" = "$GITHUB_REPOSITORY"

          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull_request/files?per_page=100")"
          expected_files="$(printf '%s\n' \
            '.github/binjad-formulas.json' \
            'Aliases/binjad-dev' \
            "Formula/binjad@${binary_ninja_version}.rb")"
          actual_files="$(jq -r '.[].filename' <<<"$files" | sort)"
          test "$actual_files" = "$expected_files"

          ruby .github/scripts/CheckFormulaMatrix.rb "$GITHUB_WORKSPACE"
          test -f "Formula/binjad@${binary_ninja_version}.rb"
          test "$(readlink Aliases/binjad-dev)" = "../Formula/binjad@${binary_ninja_version}.rb"
          test "$(jq -r '.latestDev' .github/binjad-formulas.json)" = "$binary_ninja_version"
          test "$(BINARY_NINJA_VERSION="$binary_ninja_version" \
            jq -r '.formulas[env.BINARY_NINJA_VERSION].channel' .github/binjad-formulas.json)" = dev
          source_revision="$(BINARY_NINJA_VERSION="$binary_ninja_version" \
            jq -r '.formulas[env.BINARY_NINJA_VERSION].sourceRevision' .github/binjad-formulas.json)"
          binjad_version="$(jq -r '.binjadVersion' .github/binjad-formulas.json)"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$binjad_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          source_tag="source-${binjad_version}-bn-${binary_ninja_version}"
          refs="$(git ls-remote --tags https://github.com/0cyn/binjad.git \
            "refs/tags/$source_tag" "refs/tags/$source_tag^{}")"
          tagged_revision=""
          while read -r commit reference
          do
            if [[ -n "$commit" && ( -z "$tagged_revision" || "$reference" = "refs/tags/$source_tag^{}" ) ]]
            then
              tagged_revision="$commit"
            fi
          done <<<"$refs"
          test "$tagged_revision" = "$source_revision"

          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.name == "test-bot (macos-26)" and .conclusion == "success")] | length' <<<"$jobs")" = 1
          test "$(jq '[.jobs[] | select(.name | startswith("test-bot (ubuntu-latest,")) | select(.conclusion == "success")] | length' <<<"$jobs")" = 1
          test "$(jq '[.jobs[] | select(.name | startswith("test-bot (ubuntu-24.04-arm,")) | select(.conclusion == "success")] | length' <<<"$jobs")" = 1

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          artifact_names="$(jq -r '.artifacts[] | select(.expired == false) | .name' <<<"$artifacts" | sort)"
          expected_artifacts="$(printf '%s\n' \
            'bottles_macos-26' \
            'bottles_ubuntu-24.04-arm' \
            'bottles_ubuntu-latest')"
          test "$artifact_names" = "$expected_artifacts"

          base_sha="$(jq -r '.base.sha' <<<"$pull")"
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_sha...$RUN_HEAD_SHA")"
          test "$(jq -r '.behind_by' <<<"$comparison")" = 0

          {
            echo "head_branch=$RUN_HEAD_BRANCH"
            echo "head_sha=$RUN_HEAD_SHA"
            echo "pull_request=$pull_request"
          } >> "$GITHUB_OUTPUT"
          printf "Validated PR #%s at \`%s\`.\n" "$pull_request" "$RUN_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      packages: write
      pull-requests: write
    uses: ./.github/workflows/publish.yml
    with:
      head_sha: ${{ needs.validate.outputs.head_sha }}
      pull_request: ${{ needs.validate.outputs.pull_request }}
    secrets: inherit

  cleanup:
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ needs.validate.outputs.head_branch }}
    steps:
      - name: Delete the published release branch
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" >/dev/null 2>&1
          then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_BRANCH"
          fi
